name: Refresh data

on:
  workflow_dispatch: {}
  schedule:
    # GitHub runs schedules best-effort: runs arrive hours late or get dropped.
    # Primary slots are 11:17 and 22:17 UTC (7:17a / 6:17p EDT); the later
    # slots are backups that skip themselves if a refresh already landed.
    - cron: '17 11,22 * * *'
    - cron: '47 12,23 * * *'
    - cron: '17 14,1 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if data is already fresh
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          generated=$(jq -r .generated docs/data/index.json)
          age=$(( $(date +%s) - $(date -d "$generated" +%s) ))
          echo "Data generated $generated ($((age / 60)) min ago)"
          if [ "$age" -lt $((6 * 3600)) ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.fresh.outputs.skip != 'true'
        run: npm ci
      - if: steps.fresh.outputs.skip != 'true'
        run: npm run refresh
      # Link-preview image: re-rendered from the live globe about once a day (Chrome ships on
      # the runner). Best effort: a failure here never blocks the data refresh.
      - name: Re-render link preview
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct -- docs/og.jpg) ))
          if [ "$age" -lt $((20 * 3600)) ]; then echo "og.jpg is $((age / 3600))h old; skipping"; exit 0; fi
          python3 -m http.server 8080 -d docs >/dev/null 2>&1 &
          sleep 1
          node scripts/og.mjs
      - name: Commit data
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add docs/data data docs/og.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh data"
          git push
